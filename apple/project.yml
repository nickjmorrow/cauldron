name: Cauldron
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Cauldron:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      # The Watch app ships inside the iPhone app and installs on the paired Watch with it.
      - target: CauldronWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cauldron
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Plain HTTP is allowed to local hosts only (the simulator reaching a dev server); a real server is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Default server, injected from .env at project generation (see generate.sh). Settings overrides it.
        CauldronURL: $(CAULDRON_URL)
        NSCameraUsageDescription: Take a photo of something on your shopping list.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.cauldron
        PRODUCT_NAME: Cauldron
        CAULDRON_URL: ${CAULDRON_URL}
        TARGETED_DEVICE_FAMILY: "1"
  CauldronMac:
    type: application
    platform: macOS
    # The shopping list's store and API are shared with the iPhone app; the rest is Mac-only.
    sources: [Mac, Shared, iOS/Store.swift, iOS/API.swift, iOS/LaterUndo.swift]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Cauldron
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CauldronURL: $(CAULDRON_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.cauldron.mac
        PRODUCT_NAME: Cauldron
        CAULDRON_URL: ${CAULDRON_URL}
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  CauldronWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Cauldron
        WKApplication: true
        WKCompanionAppBundleIdentifier: ${BUNDLE_PREFIX}.cauldron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.cauldron.watchkitapp
        PRODUCT_NAME: CauldronWatch
        TARGETED_DEVICE_FAMILY: "4"
